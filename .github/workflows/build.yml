name: Builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Read and validate version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version=$(sed -n 's/.*:version "\([^"]*\)".*/\1/p' agent-duet.asd | head -1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ -n "$TAG" && "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match system version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl gtk4 libadwaita vte3 librsvg
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
      - uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-build-v1-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('agent-duet.asd') }}
      - name: Install Quicklisp
        run: |
          if [ ! -f "$HOME/quicklisp/setup.lisp" ]; then
            curl -fsSLo "$RUNNER_TEMP/quicklisp.lisp" https://beta.quicklisp.org/quicklisp.lisp
            sbcl --no-userinit --non-interactive --load "$RUNNER_TEMP/quicklisp.lisp" \
              --eval '(quicklisp-quickstart:install :path (merge-pathnames "quicklisp/" (user-homedir-pathname)))'
          fi
          echo '(load (merge-pathnames "quicklisp/setup.lisp" (user-homedir-pathname)))' > "$HOME/.sbclrc"
      - name: Install GTK bindings
        run: |
          if [ ! -d "$HOME/quicklisp/local-projects/gtk4/.git" ]; then
            git clone https://github.com/crazymevt/gtk4.git "$HOME/quicklisp/local-projects/gtk4"
          fi
          git -C "$HOME/quicklisp/local-projects/gtk4" fetch origin 4f7ac6daf9de3f4fce1ca75b0f5dbf56681fac70
          git -C "$HOME/quicklisp/local-projects/gtk4" checkout --detach FETCH_HEAD
      - run: make test
      - name: Build and package macOS app
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          make app
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/Agent Duet.app" "dist/agent-duet-$VERSION-$PLATFORM.zip"
      - name: Build and package Linux executable
        if: runner.os == 'Linux'
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          make build
          package="agent-duet-$VERSION-$PLATFORM"
          mkdir -p "build/$package" dist
          cp bin/agent-duet LICENSE README.md "build/$package/"
          tar -czf "dist/$package.tar.gz" -C build "$package"
      - name: Checksums
        run: |
          cd dist
          for archive in *.zip *.tar.gz; do
            [ -f "$archive" ] || continue
            shasum -a 256 "$archive" > "$archive.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: agent-duet-${{ env.VERSION }}-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release-notes.py "${TAG#v}" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Agent Duet $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" dist/* --clobber
